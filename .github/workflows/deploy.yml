name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a queued run supersede an in-flight one, but never cancel a deploy
# that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Vite 8 requires ^20.19.0 || >=22.12.0
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs `tsc --noEmit && vite build`, so a type error fails the deploy
      # instead of shipping a broken bundle.
      - run: npm run build

      # `enablement` lets the workflow's own repo-scoped token switch Pages
      # from branch-deploy to Actions. Harmless once that is already the case.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
